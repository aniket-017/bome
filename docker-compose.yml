services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bom
      POSTGRES_PASSWORD: bom
      POSTGRES_DB: bom
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "work_mem=32MB", "-c", "maintenance_work_mem=512MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bom"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://bom:bom@db:5432/bom
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "8767:8767"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
